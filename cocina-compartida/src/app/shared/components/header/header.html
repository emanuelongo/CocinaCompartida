<header class="main-header">
    <div class="header-content">
        <div routerLink="/home" class="logo">
            CocinaCompartida®
        </div>

        <div class="search-section">
            <div class="search-box" [class.suggestions-open]="showSuggestions()">
                <input type="text" [(ngModel)]="searchQuery" (input)="onSearchInput()" (keydown)="onKeyDown($event)"
                    (blur)="hideSuggestions()" placeholder="Buscar recetas..." class="search-input"
                    autocomplete="off" />
                <button type="button" class="search-icon" (click)="onSearch()" aria-label="Buscar">
                    <i class="fas fa-search"></i>
                </button>

                <!-- Suggestions dropdown -->
                <div class="suggestions-dropdown" *ngIf="showSuggestions() && searchService.suggestions().length > 0">
                    <div class="suggestion-item" *ngFor="let recipe of searchService.suggestions(); let i = index"
                        [class.selected]="i === selectedSuggestionIndex()" (mousedown)="selectSuggestion(recipe)">
                        <div class="suggestion-content">
                            <strong>{{ recipe.name }}</strong>
                            <span class="suggestion-category">{{ recipe.category }}</span>
                        </div>
                        <small class="suggestion-author">por {{ recipe.user.username }}</small>
                    </div>
                </div>
            </div>

            <div class="sort-options">
                <select [(ngModel)]="sortOption" (change)="onSortChange()">
                    <option value="recent">Más recientes</option>
                    <option value="oldest">Más antiguas</option>
                    <option value="likes">Más likes</option>
                </select>

                <!-- Custom Dropdown: Dificultad -->
                <div class="custom-dropdown" (click)="toggleMenu('dificultad')">
                    <div class="dropdown-header" [class.active-filter]="searchService.currentDificultad().length > 0">
                        <i class="fas fa-signal" style="font-size:0.75rem"></i>
                        Dificultad
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="dropdown-menu" *ngIf="dificultadMenuOpen" (click)="$event.stopPropagation()">
                        <label class="dropdown-item">
                            <input type="checkbox" 
                                   [checked]="searchService.currentDificultad().length === 0" 
                                   (change)="toggleDificultad('todas')">
                            Todas
                        </label>
                        <label class="dropdown-item">
                            <input type="checkbox" 
                                   [checked]="searchService.currentDificultad().includes('facil')" 
                                   (change)="toggleDificultad('facil')">
                            Fácil
                        </label>
                        <label class="dropdown-item">
                            <input type="checkbox" 
                                   [checked]="searchService.currentDificultad().includes('media')" 
                                   (change)="toggleDificultad('media')">
                            Media
                        </label>
                        <label class="dropdown-item">
                            <input type="checkbox" 
                                   [checked]="searchService.currentDificultad().includes('dificil')" 
                                   (change)="toggleDificultad('dificil')">
                            Difícil
                        </label>
                    </div>
                </div>

                <!-- Custom Dropdown: Ingredientes -->
                <div class="custom-dropdown" (click)="toggleMenu('ingredientes')">
                    <div class="dropdown-header" [class.active-filter]="searchService.currentIngredientFilter().length > 0">
                        <i class="fas fa-list" style="font-size:0.75rem"></i>
                        Ingredientes
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="dropdown-menu" *ngIf="ingredientesMenuOpen" (click)="$event.stopPropagation()">
                        <label class="dropdown-item">
                            <input type="checkbox" 
                                   [checked]="searchService.currentIngredientFilter().length === 0" 
                                   (change)="toggleIngredient('todas')">
                            Todos
                        </label>
                        <label class="dropdown-item">
                            <input type="checkbox" 
                                   [checked]="searchService.currentIngredientFilter().includes('menos5')" 
                                   (change)="toggleIngredient('menos5')">
                            Menos de 5
                        </label>
                        <label class="dropdown-item">
                            <input type="checkbox" 
                                   [checked]="searchService.currentIngredientFilter().includes('mas5')" 
                                   (change)="toggleIngredient('mas5')">
                            5 o más
                        </label>
                    </div>
                </div>

                <!-- Custom Dropdown: Tiempo -->
                <div class="custom-dropdown" (click)="toggleMenu('tiempo')">
                    <div class="dropdown-header" [class.active-filter]="searchService.currentTimeFilter().length > 0">
                        <i class="fas fa-clock" style="font-size:0.75rem"></i>
                        Tiempo
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="dropdown-menu" *ngIf="tiempoMenuOpen" (click)="$event.stopPropagation()">
                        <label class="dropdown-item">
                            <input type="checkbox" 
                                   [checked]="searchService.currentTimeFilter().length === 0" 
                                   (change)="toggleTime('todas')">
                            Cualquiera
                        </label>
                        <label class="dropdown-item">
                            <input type="checkbox" 
                                   [checked]="searchService.currentTimeFilter().includes('rapido')" 
                                   (change)="toggleTime('rapido')">
                            Rápido (&lt;30m)
                        </label>
                        <label class="dropdown-item">
                            <input type="checkbox" 
                                   [checked]="searchService.currentTimeFilter().includes('medio')" 
                                   (change)="toggleTime('medio')">
                            Medio (30-60m)
                        </label>
                        <label class="dropdown-item">
                            <input type="checkbox" 
                                   [checked]="searchService.currentTimeFilter().includes('largo')" 
                                   (change)="toggleTime('largo')">
                            Largo (&gt;60m)
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <nav class="main-nav">
            <a *ngIf="authService.isLoged()" routerLink="/cooking-journal" class="nav-link">Mi diario</a>
            <a *ngIf="authService.isLoged()" routerLink="/shopping-list" class="nav-link">Lista de compras</a>
            <a routerLink="/explore" class="nav-link">Explorar</a>
            <a routerLink="/recipe-upload" class="nav-link create-recipe-link">
                <i class="fas fa-plus-circle"></i> Crear Receta
            </a>
            <div class="categories-menu">
                <select [(ngModel)]="selectedCategory" (ngModelChange)="onCategoryChange($event)"
                    class="category-select">
                    <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
                </select>
            </div>
        </nav>

        <div class="auth-section">
            <!-- Mostrar si NO está logueado -->
            <a *ngIf="!authService.isLoged()" routerLink="/login" class="action-btn">
                Iniciar Sesión
            </a>

            <!-- Mostrar si ESTÁ logueado -->
            <div *ngIf="authService.isLoged()" class="user-menu">
                <a routerLink="/profile" class="user-profile-header" title="Ver mi perfil">
                    <img
                        [src]="getAvatarUrl(authService.currentAvatar())"
                        [alt]="'Foto de ' + authService.currentUsername()"
                        class="header-user-avatar"
                        (error)="onAvatarError($event)"
                    />
                    <span class="welcome-text">Hola, {{ authService.currentUsername() }}</span>
                </a>
                <button type="button" routerLink="/home" (click)="authService.logout()" class="logout-btn">Cerrar Sesión</button>
            </div>
        </div>
    </div>
</header>
